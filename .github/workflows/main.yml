name: Update news
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download feeds
        run: |
          mkdir -p feeds
          get() { curl -fsSL -A "Mozilla/5.0" "$2" -o "feeds/$1.xml.tmp" && mv "feeds/$1.xml.tmp" "feeds/$1.xml" || rm -f "feeds/$1.xml.tmp"; }
          get top "https://feeds.bbci.co.uk/news/rss.xml"
          get nigeria "https://punchng.com/feed/"
          get world "https://feeds.bbci.co.uk/news/world/rss.xml"
          get entertainment "https://www.bellanaija.com/feed/"
          get sports "https://feeds.bbci.co.uk/sport/football/rss.xml"
          get technology "https://techcrunch.com/feed/"
      - name: Commit changes
        run: |
          git config user.name "news-bot"
          git config user.email "bot@users.noreply.github.com"
          git add feeds
          git diff --staged --quiet || (git commit -m "Update feeds" && git push)
